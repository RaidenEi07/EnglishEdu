# ============================================================
#  EnglishEdu – Production Docker Compose
#  Usage:  docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# ============================================================

services:

  # ─── Nginx reverse proxy ──────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      # - "443:443"   # Uncomment when SSL is ready
    volumes:
      - ./sunshine-rebuild/dist:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # SSL: uncomment when domain + cert are ready
      # - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - moodle
    restart: unless-stopped
    networks:
      - app_net

  # ─── Spring Boot backend ──────────────────────────────────
  backend:
    build:
      context: ./EnglishEdu_BE
      dockerfile: Dockerfile
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    environment:
      # Database
      DB_URL: jdbc:postgresql://postgres:5432/sso_db
      DB_USERNAME: sso_user
      DB_PASSWORD: ${DB_PASSWORD}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # MinIO
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: sso-uploads
      # Moodle — internal URL uses Docker service name (avoids hairpin NAT issues)
      MOODLE_URL: http://moodle:8080
      MOODLE_PUBLIC_URL: http://${LMS_DOMAIN}:8080
      MOODLE_TOKEN: ${MOODLE_TOKEN}
      MOODLE_SSO_SECRET: ${MOODLE_SSO_SECRET}
      MOODLE_SERVICE_NAME: ${MOODLE_SERVICE_NAME:-Sunshine_BE}
      # Auth
      JWT_SECRET: ${JWT_SECRET}
      # App
      # HTTP mode (no domain yet) — change to https:// when SSL is ready
      APP_BASE_URL: http://${DOMAIN}
      CORS_ORIGINS: http://${DOMAIN}
      # Mail
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      # Production: Flyway manages schema — Hibernate only validates; disable flyway:clean
      JPA_DDL_AUTO: validate
      FLYWAY_CLEAN_DISABLED: "true"
      # Admin account seed (override defaults)
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sunshine.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # Never seed demo teacher in production
      SEED_DEMO_TEACHER: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped
    networks:
      - app_net

  # ─── PostgreSQL (for Spring Boot) ─────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sso_db
      POSTGRES_USER: sso_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sso_user -d sso_db"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app_net

  # ─── Redis (JWT blacklist + cache) ────────────────────────
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app_net

  # ─── MinIO (file storage) ─────────────────────────────────
  minio:
    image: minio/minio:latest
    expose:
      - "9000"
    ports:
      - "9001:9001"   # Console – restrict via firewall in production
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    restart: unless-stopped
    networks:
      - app_net

  # ─── Moodle LMS ───────────────────────────────────────────
  moodle:
    build:
      context: ./moddle-lms
      dockerfile: Dockerfile
    image: englishedu-moodle:4.5
    ports:
      - "8080:8080"
    environment:
      - MOODLE_DATABASE_HOST=mariadb
      - ALLOW_EMPTY_PASSWORD=yes
      - MOODLE_DATABASE_USER=bn_moodle
      - MOODLE_DATABASE_PASSWORD=bn_pass
      - MOODLE_DATABASE_NAME=bitnami_moodle
      - MOODLE_HOST=${LMS_DOMAIN}
      - MOODLE_HTTP_PORT_NUMBER=8080
      - MOODLE_USERNAME=${MOODLE_ADMIN_USER:-admin}
      - MOODLE_PASSWORD=${MOODLE_ADMIN_PASSWORD}
      - MOODLE_EMAIL=${MOODLE_ADMIN_EMAIL}
    volumes:
      - moodle_data:/bitnami/moodle
      - moodledata_data:/bitnami/moodledata
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_net

  # ─── MariaDB (for Moodle) ─────────────────────────────────
  mariadb:
    image: bitnamilegacy/mariadb:latest
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - MARIADB_USER=bn_moodle
      - MARIADB_PASSWORD=bn_pass
      - MARIADB_DATABASE=bitnami_moodle
      - MARIADB_CHARACTER_SET=utf8mb4
      - MARIADB_COLLATE=utf8mb4_unicode_ci
    volumes:
      - mariadb_data:/bitnami/mariadb
      # DB import: done manually after first startup (see DEPLOY-GUIDE.md step 5)
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/mariadb/bin/mysqladmin ping -h 127.0.0.1 -u root 2>/dev/null || /opt/bitnami/mariadb/bin/mariadb-admin ping -h 127.0.0.1 -u root 2>/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    restart: unless-stopped
    networks:
      - app_net

networks:
  app_net:
    driver: bridge

volumes:
  pgdata:
  miniodata:
  moodle_data:
  moodledata_data:
  mariadb_data:
